version: '3.8'

services:
  web:
    build: .
    container_name: weekly-report-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - REPORT_DATA_DIR=/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
